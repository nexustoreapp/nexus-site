<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Entrar ou Criar conta — Nexus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="icon" type="image/png" href="fivecon.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>

  <!-- reCAPTCHA: render explícito (NÃO desativa nada) -->
  <script>
    window.NEXUS_RECAPTCHA_SITE_KEY = "6Lfu50QsAAAAAJNoJNLk4plvQNeWxWzoMTXMtEHN";
    window.__nexusRecaptchaWidgetId = null;

    window.onRecaptchaLoad = function () {
      try {
        if (!window.grecaptcha) return;
        const box = document.getElementById("captchaBox");
        if (!box) return;

        if (window.__nexusRecaptchaWidgetId === null) {
          window.__nexusRecaptchaWidgetId = grecaptcha.render(box, {
            sitekey: window.NEXUS_RECAPTCHA_SITE_KEY
          });
        }
      } catch (e) {}
    };
  </script>
  <script src="https://www.google.com/recaptcha/api.js?onload=onRecaptchaLoad&render=explicit" async defer></script>
</head>

<body>
  <header class="topbar">
    <a href="index.html" class="brand">
      <img src="logo.png" alt="Nexus" class="brand-logo" />
      <span class="brand-name">Nexus Store</span>
    </a>

    <nav class="topbar-nav">
      <a href="index.html" class="nav-link">Início</a>
      <a href="buscar.html" class="nav-link">Buscar</a>
      <a href="minha-conta.html" class="nav-link">Minha conta</a>
    </nav>
  </header>

  <main class="container auth-wrap">
    <section class="card auth-card">
      <h1 id="formTitle" class="h1">Entrar</h1>
      <p id="formSubtitle" class="muted">Acesse sua conta para continuar.</p>

      <div id="formError" class="alert alert-error" style="display:none;"></div>
      <div id="captchaOwnerError" class="alert alert-warn" style="display:none;"></div>

      <form id="authForm" class="auth-form" autocomplete="on">
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="seuemail@email.com" required />
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" placeholder="••••••••" required />
        </div>

        <div id="registerFields" style="display:none;">
          <div class="field">
            <label for="name">Nome</label>
            <input id="name" name="name" type="text" placeholder="Seu nome" />
          </div>

          <div class="field">
            <label for="cpf">CPF</label>
            <input id="cpf" name="cpf" type="text" placeholder="000.000.000-00" />
          </div>

          <div class="field">
            <label for="phone">Telefone</label>
            <input id="phone" name="phone" type="text" placeholder="(00) 00000-0000" />
          </div>

          <div class="field">
            <label>Confirmação de segurança</label>
            <div id="captchaBox"></div>
            <small class="muted">
              Se aparecer “domínio inválido”, é configuração no Google reCAPTCHA (não é backend).
            </small>
          </div>
        </div>

        <button id="submitBtn" type="submit" class="btn btn-primary">Entrar</button>

        <div class="auth-actions">
          <button id="toggleModeBtn" type="button" class="btn btn-link">
            Não tenho conta. Quero cadastrar
          </button>
        </div>
      </form>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
