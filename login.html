<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Entrar ou Criar conta — Nexus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="icon" type="image/png" href="fivecon.png" />
  <link rel="stylesheet" href="style.css" />

  <script src="config.js"></script>

  <!-- reCAPTCHA: render explícito (NÃO desativa nada) -->
  <script>
    window.NEXUS_RECAPTCHA_SITE_KEY = "6Lfu50QsAAAAAJNoJNLk4plvQNeWxWzoMTXMtEHN";
    window.__nexusRecaptchaWidgetId = null;

    window.onRecaptchaLoad = function () {
      try {
        if (!window.grecaptcha) return;
        const box = document.getElementById("captchaBox");
        if (!box) return;

        if (window.__nexusRecaptchaWidgetId === null) {
          window.__nexusRecaptchaWidgetId = grecaptcha.render(box, {
            sitekey: window.NEXUS_RECAPTCHA_SITE_KEY
          });
        }
      } catch (e) {}
    };
  </script>
  <script src="https://www.google.com/recaptcha/api.js?onload=onRecaptchaLoad&render=explicit" async defer></script>
</head>

<body>
  <!-- TOPBAR ÚNICA (injetada por layout.js) -->
  <div id="topbar-root"></div>

  <main class="page">
    <div class="container">
      <div class="card page-card">
        <div class="pad">
          <h1 id="formTitle" style="font-weight:1000;">Entrar</h1>
          <p id="formSubtitle" class="helper">Acesse sua conta para continuar.</p>

          <div id="formError" class="soft" style="display:none;padding:12px;border:1px solid rgba(255,43,43,.35);background:rgba(255,43,43,.08);margin-top:12px;"></div>
          <div id="captchaOwnerError" class="soft" style="display:none;padding:12px;border:1px solid rgba(148,163,184,.25);background:rgba(255,255,255,.03);margin-top:12px;"></div>

          <div class="hr" style="margin:14px 0;"></div>

          <form id="authForm" class="soft" style="padding:14px;" autocomplete="on">
            <div class="form-grid">
              <div>
                <div class="helper">E-mail</div>
                <input class="input" id="email" name="email" type="email" placeholder="seuemail@email.com" required />
              </div>

              <div>
                <div class="helper">Senha</div>
                <input class="input" id="password" name="password" type="password" placeholder="••••••••" required />
              </div>
            </div>

            <div id="registerFields" style="display:none;margin-top:12px;">
              <div class="form-grid">
                <div>
                  <div class="helper">Nome</div>
                  <input class="input" id="name" name="name" type="text" placeholder="Seu nome" />
                </div>

                <div>
                  <div class="helper">CPF</div>
                  <input class="input" id="cpf" name="cpf" type="text" placeholder="000.000.000-00" />
                </div>

                <div>
                  <div class="helper">Telefone</div>
                  <input class="input" id="phone" name="phone" type="text" placeholder="(00) 00000-0000" />
                </div>
              </div>

              <div style="margin-top:12px;">
                <div class="helper">Confirmação de segurança</div>
                <div id="captchaBox" style="margin-top:8px;"></div>
                <div class="helper" style="margin-top:8px;">
                  Se aparecer “domínio inválido”, é configuração no Google reCAPTCHA (não é backend).
                </div>
              </div>
            </div>

            <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
              <button id="submitBtn" type="submit" class="btn btn-primary">Entrar</button>
              <button id="toggleModeBtn" type="button" class="btn btn-outline">Não tenho conta. Quero cadastrar</button>
              <a class="btn btn-ghost" href="index.html">Voltar</a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </main>

  <script src="layout.js"></script>
  <script src="out.js"></script>
  <script src="login.js"></script>
</body>
</html>
