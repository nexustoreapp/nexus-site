<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contato | Nexus Store</title>
  <link rel="icon" href="favicon.png"/>
  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>
</head>
<body>
  <header class="topbar"></header>

  <main class="page">
    <div class="container">
      <div class="card page-card">
        <div class="pad">
          <h2 style="font-weight:1000">Contato</h2>
          <p style="color:var(--muted);font-weight:800;margin-top:6px">
            Visual pronto. Depois você pluga WhatsApp/email real.
          </p>

          <div class="soft" style="margin-top:12px;padding:14px">
            <div style="font-weight:1000">Email</div>
            <div style="color:var(--muted);font-weight:800;margin-top:6px">contato@nexustore.store</div>

            <div style="height:12px"></div>

            <div style="font-weight:1000">WhatsApp</div>
            <div style="color:var(--muted);font-weight:800;margin-top:6px">(xx) xxxxx-xxxx</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="layout.js" defer></script>
  <script src="out.js" defer></script>
</body>
</html>
