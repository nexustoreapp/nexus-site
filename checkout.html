<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | Nexus Store</title>
  <link rel="icon" href="favicon.png"/>
  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>
</head>
<body>
  <header class="topbar"></header>

  <main class="page">
    <div class="container">
      <div class="card page-card">
        <div class="pad">
          <h2 style="font-weight:1000">Checkout</h2>
          <p style="color:var(--muted);font-weight:800;margin-top:6px">
            Essa página cria o pagamento no backend e te manda pro Mercado Pago.
          </p>

          <div class="soft" style="margin-top:12px;padding:14px">
            <div><strong id="productName">Plano</strong></div>
            <div style="margin-top:6px">Preço: <strong id="planPrice">R$ --</strong></div>
          </div>

          <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
            <button id="payBtn" class="btn btn-primary" type="button">Pagar agora</button>
            <a class="btn btn-outline" href="planos.html">Ver outros planos</a>
          </div>

          <pre id="result" class="soft" style="margin-top:14px;padding:14px;min-height:140px;overflow:auto"></pre>
        </div>
      </div>
    </div>
  </main>

  <script src="checkout.js" defer></script>
  <script src="layout.js" defer></script>
  <script src="out.js" defer></script>
</body>
</html>
