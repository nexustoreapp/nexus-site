<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Nexus Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.png">

</head>

<body>

<header class="topbar">
<div class="container">
<div class="topbar-inner">

<a class="brand" href="index.html">
<img src="logo.png" class="brand-logo">
<span class="brand-name">Nexus Store</span>
</a>

<form class="searchbar" action="buscar.html">
<input name="q" placeholder="Buscar produtos...">
<button class="btn btn-primary">Buscar</button>
</form>

<div class="actions">

<a class="chip" href="planos.html">Planos</a>
<a class="chip" href="dashboard.html">Minha conta</a>

<a class="chip" id="authBtn" href="login.html">Entrar</a>

</div>
</div>
</div>
</header>


<main class="container">

<section class="hero">

<div class="hero-grid">

<div class="card hero-main">

<div class="hero-title">
Marketplace Nexus com visual <span>pro</span>
</div>

<p class="hero-sub">
Produtos digitais, planos e assinatura.
</p>

<div class="hero-cta">

<a class="btn btn-primary" href="buscar.html">
Ver produtos
</a>

<a class="btn btn-outline" href="planos.html">
Ver planos
</a>

</div>

</div>

</div>

</section>


</main>


<footer class="footer">
<div class="container">
<div class="footer-bottom">
© 2026 Nexus Store
</div>
</div>
</footer>


<script src="logout.js"></script>

</body>
</html>
