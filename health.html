<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health | Nexus Store</title>
  <link rel="icon" href="favicon.png"/>
  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>
</head>
<body>
  <header class="topbar"></header>

  <main class="page">
    <div class="container">
      <div class="card page-card">
        <div class="pad">
          <h2 style="font-weight:1000">Health</h2>
          <p style="color:var(--muted);font-weight:800;margin-top:6px">
            Ping simples do backend.
          </p>

          <pre id="out" class="soft" style="margin-top:14px;padding:14px;min-height:140px;overflow:auto"></pre>
        </div>
      </div>
    </div>
  </main>

  <script>
    (async function(){
      const out = document.getElementById("out");
      if (!window.NEXUS_API) { out.textContent = "NEXUS_API não configurada."; return; }
      try{
        const r = await fetch(`${window.NEXUS_API}/health`);
        const d = await r.json().catch(()=>null);
        out.textContent = JSON.stringify(d, null, 2);
      }catch(e){
        out.textContent = "Erro ao chamar health.";
      }
    })();
  </script>

  <script src="layout.js" defer></script>
  <script src="out.js" defer></script>
</body>
</html>
