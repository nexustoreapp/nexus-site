<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Nexus Store | Planos</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="topbar-root"></div>

  <main class="page">
    <div class="container">
      <div class="card page-card">
        <div class="pad">
          <h2 style="font-weight:1000;">Planos</h2>
          <p class="helper">Escolha seu plano e vá pro checkout.</p>
          <div class="hr"></div>

          <div class="grid" id="plansGrid"></div>

          <div class="helper" style="margin-top:12px;opacity:.9;">
            Dica: o checkout usa <code>checkout.html?plan=core</code> (ou <code>hyper</code>, <code>omega</code>, etc).
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="layout.js"></script>
  <script src="out.js"></script>

  <script>
    function getUserPlanFromToken() {
      const token = localStorage.getItem("nexus_token");
      if (!token) return "free";
      try {
        const payload = JSON.parse(atob(token.split(".")[1]));
        return (payload.plan || "free").toLowerCase();
      } catch {
        return "free";
      }
    }

    const currentPlan = getUserPlanFromToken();
    const grid = document.getElementById("plansGrid");

    const PLANS = [
      { key: "free",  name: "Free",  price: "R$ 0,00",   desc: "Acesso básico", col: "col-4" },
      { key: "core",  name: "Core",  price: "R$ 19,90",  desc: "Comece a economizar", col: "col-4" },
      { key: "hyper", name: "Hyper", price: "R$ 39,90",  desc: "Alta vantagem", col: "col-4" },
      { key: "omega", name: "Omega", price: "R$ 69,90",  desc: "Acesso total", col: "col-4" },

      /* ======================================
         INICIO_PLANO_TESTE
         plano temporário para testar pagamento
         ====================================== */
      { key: "core_test", name: "Core Teste", price: "R$ 0,01", desc: "Só para testes do Mercado Pago", col: "col-12" }
      /* ======================================
         FIM_PLANO_TESTE
         ====================================== */
    ];

    function cardHtml(p) {
      const isCurrent = p.key === currentPlan;
      const badge = isCurrent ? `<span class="chip" style="border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.10);">Plano atual</span>` : "";
      const btn = (p.key === "free")
        ? `<a class="btn btn-outline" href="minha-conta.html">Continuar no Free</a>`
        : `<a class="btn btn-primary" href="checkout.html?plan=${encodeURIComponent(p.key)}">Ir pro checkout</a>`;

      return `
        <div class="card product ${p.col}">
          <div class="body" style="padding:16px;">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
              <div style="font-weight:1000;font-size:18px;">${p.name}</div>
              ${badge}
            </div>
            <div class="helper" style="margin-top:6px;">${p.desc}</div>
            <div style="margin-top:10px;font-weight:1000;font-size:18px;">${p.price}</div>
            <div class="row" style="margin-top:12px;">${btn}</div>
          </div>
        </div>
      `;
    }

    grid.innerHTML = PLANS.map(cardHtml).join("");
  </script>
</body>
</html>
