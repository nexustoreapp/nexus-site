<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Planos — Nexus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.png"/>

  <style>
    .plans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .plan-card {
      background: #0f0f0f;
      border: 1px solid #222;
      border-radius: 14px;
      padding: 22px;
      text-align: center;
    }

    .plan-card h2 {
      margin-bottom: 6px;
    }

    .plan-card p {
      font-size: 14px;
      opacity: .7;
      margin-bottom: 16px;
    }

    .plan-card ul {
      list-style: none;
      padding: 0;
      margin: 16px 0;
      font-size: 14px;
    }

    .plan-card ul li {
      margin: 6px 0;
    }

    .current {
      border: 2px solid #16a34a;
    }

    .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      background: #16a34a;
      color: #fff;
    }

    .btn-disabled {
      opacity: .5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<header class="topbar">
  <a href="index.html" class="brand">
    <img src="logo.png" class="brand-logo"/>
    <span class="brand-name">Nexus</span>
  </a>

  <nav class="nav">
    <a href="index.html" class="nav-link">Início</a>
    <a href="dashboard.html" class="nav-link">Minha conta</a>
  </nav>
</header>

<main class="page">
  <section class="section">
    <h1>Escolha seu plano</h1>
    <p class="muted-text">
      Compare os benefícios e faça upgrade quando quiser.
    </p>

    <div class="plans-grid" id="plans"></div>
  </section>
</main>

<footer class="footer">
  <div class="footer-bottom">
    <p>© 2026 Nexus. Todos os direitos reservados.</p>
  </div>
</footer>

<script>
const token = localStorage.getItem("nexus_token");
if (!token) {
  window.location.href = "login.html";
}

function getUserPlan() {
  try {
    const payload = JSON.parse(atob(token.split(".")[1]));
    return payload.plan || "free";
  } catch {
    return "free";
  }
}

const currentPlan = getUserPlan();

const PLANS = [
  {
    id: "free",
    name: "Free",
    desc: "Acesso básico",
    features: [
      "Visualização limitada",
      "Bloqueios frequentes",
      "Sem prioridade"
    ]
  },
  {
    id: "core",
    name: "Core",
    desc: "Comece a economizar",
    features: [
      "Acesso ampliado",
      "Menos bloqueios",
      "Produtos exclusivos"
    ]
  },
  {
    id: "hyper",
    name: "Hyper",
    desc: "Alta vantagem",
    features: [
      "Quase todos os produtos",
      "Bloqueios raros",
      "Prioridade"
    ]
  },
  {
    id: "omega",
    name: "Omega",
    desc: "Acesso total",
    features: [
      "Todos os produtos",
      "Zero bloqueios",
      "Máxima prioridade"
    ]
  }
];

const container = document.getElementById("plans");

PLANS.forEach(p => {
  const card = document.createElement("div");
  card.className = "plan-card" + (p.id === currentPlan ? " current" : "");

  card.innerHTML = `
    <h2>${p.name}</h2>
    <p>${p.desc}</p>

    <ul>
      ${p.features.map(f => `<li>✔ ${f}</li>`).join("")}
    </ul>

    ${p.id === currentPlan
      ? `<span class="badge">Plano atual</span>`
      : `<button class="btn-primary">Selecionar</button>`
    }
  `;

  if (p.id !== currentPlan) {
    card.querySelector("button").onclick = () => {
      localStorage.setItem("nexus_plan_intent", p.id);
      window.location.href = "checkout.html";
    };
  }

  container.appendChild(card);
});
</script>
<!-- ===== INICIO PLANO TESTE ===== -->

<div class="plano">
  <h3>Core Teste</h3>
  <p>Plano apenas para testes do sistema</p>

  <div class="preco">
    R$ 0,01
  </div>

  <button onclick="comprarPlano('core_teste', 0.01)">
    Comprar
  </button>
</div>

<!-- ===== FIM PLANO TESTE ===== -->
</body>
</html>
