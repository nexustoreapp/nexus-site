<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Produto — Nexus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<header class="topbar">
  <a href="index.html" class="brand">
    <img src="logo.png" class="brand-logo"/>
    <span class="brand-name">Nexus</span>
  </a>

  <nav class="nav">
    <a href="index.html" class="nav-link">Início</a>
    <a href="assinatura.html" class="nav-link">Assinatura</a>
    <a href="login.html" class="nav-link" id="loginLink">Entrar</a>
  </nav>
</header>

<main class="page">
  <section class="section">
    <h1>Produto Premium Exemplo</h1>

    <button id="buyBtn" class="btn-primary">
      Comprar agora
    </button>

    <p id="msg" class="small-text"></p>
  </section>
</main>

<footer class="footer">
  <div class="footer-container">
    <div class="footer-brand">
      <img src="logo.png" alt="Nexus" class="footer-logo">
      <p class="footer-desc">
        Nexus é um marketplace tecnológico focado em inteligência,
        automação e curadoria avançada de produtos.
      </p>
    </div>

    <div class="footer-links">
      <h4>Institucional</h4>
      <a href="quem-somos.html">Quem Somos</a>
      <a href="contato.html">Contato</a>
    </div>

    <div class="footer-links">
      <h4>Legal</h4>
      <a href="termos.html">Termos de Uso</a>
      <a href="privacidade.html">Política de Privacidade</a>
    </div>
  </div>

  <div class="footer-bottom">
    <p>© 2026 Nexus. Todos os direitos reservados.</p>
  </div>
</footer>

<script>
const PRODUCT_ID = "produto-001";
const msg = document.getElementById("msg");
const token = localStorage.getItem("nexus_token");

(function(){
  const link = document.getElementById("loginLink");
  if (token) {
    link.innerText = "Minha conta";
    link.href = "dashboard.html";
  }
})();

function getPlan(){
  try {
    return JSON.parse(atob(token.split(".")[1])).plan || "free";
  } catch {
    return "free";
  }
}

function isBlocked(plan){
  if (plan === "omega") return false;
  const hash = (PRODUCT_ID + new Date().toDateString())
    .split("").reduce((a,c)=>a+c.charCodeAt(0),0) % 100;

  if (plan === "free") return hash < 70;
  if (plan === "core") return hash < 45;
  if (plan === "hyper") return hash < 30;
  return true;
}

document.getElementById("buyBtn").onclick = () => {
  if (!token) {
    localStorage.setItem("nexus_intent", "buy:" + PRODUCT_ID);
    window.location.href = "login.html";
    return;
  }

  if (isBlocked(getPlan())) {
    msg.innerText = "Este produto exige um plano superior.";
    setTimeout(()=>window.location.href="assinatura.html", 900);
    return;
  }

  msg.innerText = "Checkout liberado.";
};
</script>

</body>
</html>
