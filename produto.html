<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Nexus Store Produto</title>

<link rel="stylesheet" href="/css/style.css">

</head>

<body>

<header>

<h1>Nexus Store</h1>

<input
type="text"
placeholder="Buscar produto..."
id="search"
/>

</header>


<main>

<section class="produto">

<h2 id="produto-nome">
Carregando...
</h2>

<div class="produto-img">

<img
id="produto-imagem"
src=""
alt="produto"
/>

</div>

<div class="produto-preco">

<span id="produto-preco">
R$ 0.00
</span>

</div>

<div class="produto-descricao">

<p id="produto-descricao">
Descrição do produto
</p>

</div>

<div class="produto-comprar">

<button id="btn-comprar">
Comprar
</button>

</div>

</section>

</main>


<footer>

<p>
Nexus Store
</p>

</footer>


<script src="/produto.js"></script>

</body>

</html>
