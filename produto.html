<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title id="pageTitle">Produto — Nexus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <meta name="description" id="metaDesc" content="Produto Nexus" />

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.png"/>
</head>

<body>

<header class="topbar">
  <a href="index.html" class="brand">
    <img src="logo.png" class="brand-logo"/>
    <span class="brand-name">Nexus</span>
  </a>

  <nav class="nav">
    <a href="index.html" class="nav-link">Início</a>
    <a href="assinatura.html" class="nav-link">Assinatura</a>
    <a href="login.html" class="nav-link" id="loginLink">Entrar</a>
  </nav>
</header>

<main class="page">

<section class="section product-layout">

  <div class="product-image">
    <img id="productImage" src="fallback.png" alt="Produto"/>
  </div>

  <div class="product-info">
    <h1 id="productTitle">Carregando...</h1>
    <p id="productDesc" class="muted-text"></p>

    <!-- VARIAÇÕES -->
    <div class="variation-box">
      <label for="variationSelect">Opções disponíveis</label>
      <select id="variationSelect"></select>
    </div>

    <div class="product-price" id="productPrice"></div>

    <button id="buyBtn" class="btn-primary">
      Comprar
    </button>

    <p id="msg" class="small-text"></p>
  </div>

</section>

</main>

<footer class="footer">
  <div class="footer-container">
    <div class="footer-brand">
      <img src="logo.png" alt="Nexus" class="footer-logo">
      <p class="footer-desc">
        Nexus é um marketplace tecnológico focado em inteligência,
        automação e curadoria avançada de produtos.
      </p>
    </div>

    <div class="footer-links">
      <h4>Institucional</h4>
      <a href="quem-somos.html">Quem Somos</a>
      <a href="contato.html">Contato</a>
    </div>

    <div class="footer-links">
      <h4>Legal</h4>
      <a href="termos.html">Termos de Uso</a>
      <a href="privacidade.html">Política de Privacidade</a>
    </div>
  </div>

  <div class="footer-bottom">
    <p>© 2026 Nexus. Todos os direitos reservados.</p>
  </div>
</footer>

<script src="config.js"></script>
<script>
/* ===============================
   AUTH HEADER
================================ */
(function(){
  const link = document.getElementById("loginLink");
  if (localStorage.getItem("nexus_token")) {
    link.innerText = "Minha conta";
    link.href = "dashboard.html";
  }
})();

/* ===============================
   PARAMS
================================ */
const params = new URLSearchParams(window.location.search);
const productId = params.get("id") || params.get("handle");
const msg = document.getElementById("msg");

if (!productId) {
  msg.innerText = "Produto inválido.";
  throw new Error("Produto inválido");
}

/* ===============================
   LOAD PRODUTO + VARIAÇÕES
================================ */
let currentVariation = null;

fetch(`${window.NEXUS_API}/products/${encodeURIComponent(productId)}`)
.then(r => r.json())
.then(d => {
  if (!d.ok) throw new Error();

  const p = d.product;

  document.getElementById("productTitle").innerText = p.title;
  document.getElementById("productDesc").innerText = p.description || "";
  document.getElementById("productImage").src = p.image || "fallback.png";

  document.title = `${p.title} — Nexus`;
  document.getElementById("metaDesc").content = p.description || p.title;

  const select = document.getElementById("variationSelect");
  select.innerHTML = "";

  p.variations.forEach((v, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.innerText = `${v.name} — ${v.seller}`;
    select.appendChild(opt);
  });

  select.onchange = () => applyVariation(p.variations[select.value]);
  applyVariation(p.variations[0]);
})
.catch(() => {
  msg.innerText = "Erro ao carregar produto.";
});

function applyVariation(v){
  currentVariation = v;
  document.getElementById("productPrice").innerText =
    "R$ " + v.price.toLocaleString("pt-BR");
}

/* ===============================
   PLANO & BLOQUEIO
================================ */
function getUserPlan(){
  try {
    const token = localStorage.getItem("nexus_token");
    const payload = JSON.parse(atob(token.split(".")[1]));
    return payload.plan || "free";
  } catch {
    return "free";
  }
}

function isBlocked(plan){
  if (plan === "omega") return false;

  const seed = productId + new Date().toDateString();
  let hash = 0;
  for (let i=0;i<seed.length;i++) hash += seed.charCodeAt(i);
  const mod = hash % 100;

  if (plan === "free") return mod < 70;
  if (plan === "core") return mod < 45;
  if (plan === "hyper") return mod < 30;

  return true;
}

/* ===============================
   BUY
================================ */
document.getElementById("buyBtn").onclick = () => {
  const token = localStorage.getItem("nexus_token");

  if (!token) {
    localStorage.setItem("nexus_intent", "buy:" + productId);
    window.location.href = "login.html";
    return;
  }

  const plan = getUserPlan();

  if (isBlocked(plan)) {
    msg.innerText = "Este produto exige um plano superior.";
    setTimeout(() => {
      window.location.href = "assinatura.html";
    }, 1000);
    return;
  }

  msg.innerText =
    `Checkout liberado — ${currentVariation.name} (${currentVariation.seller})`;
};
</script>

</body>
</html>
