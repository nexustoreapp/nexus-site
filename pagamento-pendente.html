<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Pagamento pendente — Nexus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.png"/>

  <style>
    .pending-box {
      max-width: 520px;
      margin: 80px auto;
      padding: 36px;
      background: #0f0f0f;
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(0,0,0,.4);
      text-align: center;
    }

    .pending-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .pending-box h1 {
      margin-bottom: 10px;
    }

    .pending-box p {
      opacity: .75;
      font-size: 15px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .info {
      border: 1px solid #222;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: left;
    }

    .row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #333;
      color: #fff;
    }
  </style>
</head>

<body>

<header class="topbar">
  <a href="index.html" class="brand">
    <img src="logo.png" class="brand-logo"/>
    <span class="brand-name">Nexus</span>
  </a>
</header>

<main class="page">
  <div class="pending-box">

    <div class="pending-icon">⏳</div>

    <h1>Pagamento pendente</h1>

    <p>
      Seu pagamento foi iniciado, mas ainda não foi confirmado.
      Assim que o sistema identificar a compensação, seu acesso será liberado automaticamente.
    </p>

    <div class="info">
      <div class="row">
        <span>Status</span>
        <strong>Aguardando pagamento</strong>
      </div>

      <div class="row">
        <span>Método</span>
        <strong>PIX</strong>
      </div>

      <div class="row">
        <span>Plano</span>
        <strong id="planName">—</strong>
      </div>
    </div>

    <button class="btn" onclick="refreshStatus()">
      Já paguei, verificar novamente
    </button>

    <button class="btn btn-outline" onclick="goHome()">
      Voltar para Home
    </button>

  </div>
</main>

<footer class="footer">
  <div class="footer-bottom">
    <p>© 2026 Nexus. Todos os direitos reservados.</p>
  </div>
</footer>

<script>
/* ===============================
   AUTH
================================ */
const token = localStorage.getItem("nexus_token");
if (!token) {
  window.location.href = "login.html";
}

/* ===============================
   PLANO
================================ */
const plan = localStorage.getItem("nexus_plan");
document.getElementById("planName").innerText =
  plan ? plan.toUpperCase() : "—";

/* ===============================
   AÇÕES
================================ */
function refreshStatus() {
  // no futuro: consultar backend / webhook
  alert("Pagamento ainda não confirmado. Aguarde alguns minutos.");
}

function goHome() {
  window.location.href = "index.html";
}
</script>

</body>
</html>
