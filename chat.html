<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yara | Nexus Store</title>
  <link rel="icon" href="favicon.png"/>
  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>
  <style>
    .chat-wrap{padding:16px}
    .chat-card{max-width:900px;margin:18px auto}
    .chat-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
    .chat-head h1{font-size:1.1rem;font-weight:1000}
    #chatMessages{height:min(60vh,520px);overflow:auto;padding:14px;border-radius:16px;
      border:1px solid rgba(148,163,184,.16);background:rgba(255,255,255,.03)}
    .msg{padding:10px 12px;border-radius:14px;max-width:85%;white-space:pre-wrap;word-break:break-word;
      border:1px solid rgba(148,163,184,.16);margin:8px 0}
    .msg-user{margin-left:auto;background:rgba(255,43,43,.10);border-color:rgba(255,43,43,.28)}
    .msg-bot{margin-right:auto;background:rgba(255,255,255,.03)}
    .chat-form{display:flex;gap:10px;margin-top:12px}
  </style>
</head>
<body>
  <header class="topbar"></header>

  <div class="chat-wrap">
    <div class="card chat-card">
      <div class="pad">
        <div class="chat-head">
          <h1>Yara Nexus</h1>
          <small style="color:var(--muted);font-weight:900">Assistente da loja</small>
        </div>

        <div id="chatMessages" aria-live="polite"></div>

        <div class="chat-form">
          <input id="chatInput" class="input" placeholder="Digite sua mensagem..." />
          <button id="chatSendBtn" class="btn btn-primary" type="button">Enviar</button>
        </div>

        <p style="margin-top:10px;color:var(--muted);font-size:13px;font-weight:800">
          Dica: você também pode abrir esse chat pela bolha 💬 no canto do site.
        </p>
      </div>
    </div>
  </div>

  <script src="chat.js" defer></script>
  <script src="layout.js" defer></script>
  <script src="out.js" defer></script>
</body>
</html>
