<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Nexus Store | Pagamento confirmado</title>

<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="style.css">

<style>
.success-box{max-width:560px;margin:22px auto 0;padding:18px;text-align:center}
.success-inner{padding:18px}
.success-icon{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;margin:0 auto 12px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.30);color:#22c55e;font-size:34px;font-weight:1000}
.info{margin-top:14px;padding:14px;text-align:left}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(148,163,184,.12);font-size:14px}
.row:last-child{border-bottom:none}
.row span{color:rgba(229,231,235,.80);font-weight:900}
.row strong{font-weight:1000}
.actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style>
</head>

<body>

<div id="topbar-root"></div>

<main class="page">
<div class="container">
<div class="card page-card">
<div class="pad">

<div class="soft success-box">
<div class="success-inner">

<div class="success-icon">✔</div>

<h2 style="font-weight:1000;">Pagamento confirmado!</h2>

<p class="helper" style="margin-top:8px;">
Recebemos seu pagamento. Aguarde alguns segundos enquanto confirmamos seu plano.
</p>

<div class="soft info">

<div class="row">
<span>Status</span>
<strong>Pago</strong>
</div>

<div class="row">
<span>Método</span>
<strong id="payMethod">—</strong>
</div>

<div class="row">
<span>Plano</span>
<strong id="planName">Verificando...</strong>
</div>

</div>

<div class="actions">
<button class="btn btn-primary" type="button" id="refreshBtn">Atualizar dados</button>
<a class="btn btn-outline" href="minha-conta.html">Ir para minha conta</a>
<a class="btn btn-ghost" href="index.html">Voltar para Home</a>
</div>

</div>
</div>

</div>
</div>
</div>
</main>

<script src="config.js"></script>
<script src="layout.js"></script>
<script src="out.js"></script>

<script>
(function(){

const API = window.NEXUS_API;
const token = localStorage.getItem("nexus_token");

if(!token){
window.location.replace("login.html");
return;
}

const methodEl = document.getElementById("payMethod");
const planEl = document.getElementById("planName");
const refreshBtn = document.getElementById("refreshBtn");

function safeUpper(v){
return String(v || "—").toUpperCase();
}

function renderPaymentMethod(){
const method = localStorage.getItem("nexus_pay_method") || "PIX";
if(methodEl) methodEl.textContent = safeUpper(method);
}

async function checkPlanFromServer(){

try{

const r = await fetch(`${API}/auth/me`,{
headers:{
Authorization:"Bearer "+token
}
});

const d = await r.json();

if(d?.user?.plan){

const plan = d.user.plan;

localStorage.setItem("nexus_plan",plan);

if(planEl){
planEl.textContent = safeUpper(plan);
}

return true;

}

}catch(err){
console.error(err);
}

return false;

}

async function autoCheckPlan(){

for(let i=0;i<10;i++){

const ok = await checkPlanFromServer();

if(ok) return;

await new Promise(r=>setTimeout(r,2000));

}

}

if(refreshBtn){
refreshBtn.addEventListener("click",function(){
window.location.reload();
});
}

renderPaymentMethod();

autoCheckPlan();

})();
</script>

</body>
</html>
