<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Minha conta — Nexus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.png"/>
</head>

<body>

<header class="topbar">
  <a href="index.html" class="brand">
    <img src="logo.png" class="brand-logo"/>
    <span class="brand-name">Nexus</span>
  </a>

  <nav class="nav">
    <a href="index.html" class="nav-link">Início</a>
    <a href="assinatura.html" class="nav-link">Assinatura</a>
    <a href="#" class="nav-link" id="logoutBtn">Sair</a>
  </nav>
</header>

<main class="page">
  <section class="section">
    <h1>Minha conta</h1>
    <p>Você está logado.</p>

    <div class="card-info">
      <button onclick="goHome()" class="btn-outline">
        Voltar para Home
      </button>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="footer-container">
    <div class="footer-brand">
      <img src="logo.png" alt="Nexus" class="footer-logo">
      <p class="footer-desc">
        Nexus é um marketplace tecnológico focado em inteligência,
        automação e curadoria avançada de produtos.
      </p>
    </div>

    <div class="footer-links">
      <h4>Institucional</h4>
      <a href="quem-somos.html">Quem Somos</a>
      <a href="contato.html">Contato</a>
    </div>

    <div class="footer-links">
      <h4>Legal</h4>
      <a href="termos.html">Termos de Uso</a>
      <a href="privacidade.html">Política de Privacidade</a>
    </div>
  </div>

  <div class="footer-bottom">
    <p>© 2026 Nexus. Todos os direitos reservados.</p>
  </div>
</footer>

<script>
function goHome() {
  window.location.href = "index.html";
}

document.getElementById("logoutBtn").onclick = () => {
  localStorage.removeItem("nexus_token");
  localStorage.removeItem("nexus_plan");
  localStorage.removeItem("nexus_intent");
  window.location.href = "index.html";
};
</script>

</body>
</html>
