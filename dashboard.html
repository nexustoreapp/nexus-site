<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Nexus Store</title>
  <link rel="icon" href="favicon.png"/>
  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>
</head>
<body>
  <header class="topbar"></header>

  <main class="page">
    <div class="container">
      <div class="card page-card">
        <div class="pad">
          <h2 style="font-weight:1000">Dashboard</h2>
          <p style="color:var(--muted);font-weight:800;margin-top:6px">
            Visual padronizado. Depois liga com os dados reais.
          </p>

          <div class="grid" style="margin-top:12px">
            <div class="col-4 soft" style="padding:14px">
              <div style="font-weight:1000">Pedidos</div>
              <div style="color:var(--muted);font-weight:800;margin-top:6px">0</div>
            </div>
            <div class="col-4 soft" style="padding:14px">
              <div style="font-weight:1000">Assinantes</div>
              <div style="color:var(--muted);font-weight:800;margin-top:6px">0</div>
            </div>
            <div class="col-4 soft" style="padding:14px">
              <div style="font-weight:1000">Receita</div>
              <div style="color:var(--muted);font-weight:800;margin-top:6px">R$ 0,00</div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script src="layout.js" defer></script>
  <script src="out.js" defer></script>
</body>
</html>
