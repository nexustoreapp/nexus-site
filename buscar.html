<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscar | Nexus Store</title>
  <link rel="icon" href="favicon.png"/>
  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>
</head>
<body>
  <header class="topbar"></header>

  <main class="page">
    <div class="container">
      <div class="card page-card">
        <div class="pad">
          <h2 style="font-weight:1000">Buscar</h2>
          <p style="color:var(--muted);font-weight:800;margin-top:6px">
            Use a busca do topo ou digite aqui.
          </p>

          <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
            <input id="q" class="input" placeholder="Ex: fone bluetooth, camiseta, curso..." />
            <button id="go" class="btn btn-primary" type="button">Buscar</button>
          </div>

          <pre id="result" class="soft" style="margin-top:14px;padding:14px;min-height:140px;overflow:auto"></pre>
        </div>
      </div>
    </div>
  </main>

  <script>
    (function(){
      const input = document.getElementById("q");
      const btn = document.getElementById("go");
      const out = document.getElementById("result");

      const url = new URL(location.href);
      const q = url.searchParams.get("q") || "";
      if (input) input.value = q;

      async function run(){
        const query = (input?.value || "").trim();
        if (!query) return;
        url.searchParams.set("q", query);
        history.replaceState(null,"",url.toString());

        if (!window.NEXUS_API) {
          out.textContent = "NEXUS_API não configurada.";
          return;
        }

        out.textContent = "Buscando...";
        try{
          const r = await fetch(`${window.NEXUS_API}/search?q=${encodeURIComponent(query)}`);
          const d = await r.json().catch(()=>null);
          out.textContent = JSON.stringify(d, null, 2);
        }catch(e){
          out.textContent = "Erro de rede na busca.";
        }
      }

      btn?.addEventListener("click", run);
      input?.addEventListener("keydown", (e)=>{ if(e.key==="Enter") run(); });

      if (q) run();
    })();
  </script>

  <script src="layout.js" defer></script>
  <script src="out.js" defer></script>
</body>
</html>
