<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Buscar produtos — Nexus</title>
  <meta name="description" content="Busque produtos tech com inteligência no Nexus. Compare preços e planos." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.png"/>
</head>

<body>

<header class="topbar">
  <a href="index.html" class="brand">
    <img src="logo.png" class="brand-logo"/>
    <span class="brand-name">Nexus</span>
  </a>
</header>

<main class="page search-layout">

<aside class="filters">
  <h3>Filtros</h3>

  <label>Preço máximo</label>
  <input type="range" id="priceFilter" min="0" max="20000" step="100">
  <span id="priceLabel"></span>

  <label>Categoria</label>
  <select id="categoryFilter">
    <option value="">Todas</option>
    <option value="gpu">Placa de vídeo</option>
    <option value="notebook">Notebook</option>
    <option value="cpu">Processador</option>
  </select>

  <label>Marca</label>
  <select id="brandFilter">
    <option value="">Todas</option>
    <option value="nvidia">NVIDIA</option>
    <option value="amd">AMD</option>
    <option value="intel">Intel</option>
  </select>
</aside>

<section class="results">
  <div class="results-header">
    <p id="search-meta"></p>

    <select id="sortSelect">
      <option value="relevance">Relevância</option>
      <option value="price-asc">Menor preço</option>
      <option value="price-desc">Maior preço</option>
    </select>
  </div>

  <div id="results-grid" class="results-grid"></div>
  <div id="pagination" class="pagination"></div>
</section>

</main>

<footer class="footer">
  <div class="footer-bottom">
    <p>© 2026 Nexus. Todos os direitos reservados.</p>
  </div>
</footer>

<script src="config.js"></script>
<script src="buscar.js"></script>
</body>
</html>
