<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Meus pedidos — Nexus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<header class="topbar">
  <a href="index.html" class="brand">
    <img src="logo.png" class="brand-logo"/>
    <span class="brand-name">Nexus</span>
  </a>
</header>

<main class="page">
  <section class="section">
    <h1>Meus pedidos</h1>
    <div id="orders"></div>
  </section>
</main>

<footer class="footer">
  © 2026 Nexus
</footer>

<script src="config.js"></script>
<script>
const container = document.getElementById("orders");
const token = localStorage.getItem("nexus_token");

if (!token) {
  window.location.href = "login.html";
}

fetch(`${NEXUS_API}/orders`, {
  headers: {
    "Authorization": "Bearer " + token
  }
})
.then(r => r.json())
.then(d => {
  if (!d.ok || d.orders.length === 0) {
    container.innerHTML = "<p>Nenhum pedido encontrado.</p>";
    return;
  }

  d.orders.forEach(o => {
    const div = document.createElement("div");
    div.className = "order-card";

    div.innerHTML = `
      <strong>Pedido:</strong> ${o.id}<br>
      <strong>Status:</strong> <span class="status ${o.status}">${o.status}</span><br>
      <strong>Produto:</strong> ${o.productId}<br>
      <strong>Data:</strong> ${new Date(o.createdAt).toLocaleString()}
    `;
    container.appendChild(div);
  });
});
</script>

</body>
</html>
