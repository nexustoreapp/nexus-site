<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Nexus Store | Pedidos</title>

<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="topbar-root"></div>

<main class="page">
<div class="container">
<div class="card page-card">
<div class="pad">

<h2 style="font-weight:1000;">Meus pedidos</h2>
<p class="helper">Histórico completo de pedidos.</p>

<div class="hr"></div>

<div id="ordersBox" class="soft" style="padding:14px;">
Carregando pedidos...
</div>

</div>
</div>
</div>
</main>

<script src="config.js"></script>
<script src="layout.js"></script>
<script src="out.js"></script>

<script>

const token = localStorage.getItem("nexus_token");

if(!token){
window.location.replace("login.html");
}

const box = document.getElementById("ordersBox");

function money(cents){
return "R$ " + (Number(cents||0)/100).toFixed(2).replace(".",",");
}

function renderEmpty(){
box.innerHTML = `
<div class="helper">
Nenhum pedido encontrado ainda.
</div>
`;
}

function renderOrders(list){

if(!list || !list.length){
renderEmpty();
return;
}

let html = `
<table class="table">
<thead>
<tr>
<th>ID</th>
<th>Status</th>
<th>Valor</th>
<th>Data</th>
<th></th>
</tr>
</thead>
<tbody>
`;

for(const o of list){

html += `
<tr>
<td>${o.id}</td>
<td>${o.status}</td>
<td>${money(o.amountCents)}</td>
<td>${new Date(o.createdAt).toLocaleString("pt-BR")}</td>
<td>
<a class="btn btn-outline" href="pedidos.html?id=${o.id}">
Ver
</a>
</td>
</tr>
`;

}

html += "</tbody></table>";

box.innerHTML = html;
}

async function load(){

try{

const r = await fetch(`${window.NEXUS_API}/orders`,{
headers:{
Authorization:"Bearer "+token
}
});

const d = await r.json();

if(!r.ok || !d?.ok){
throw new Error("LOAD_FAILED");
}

renderOrders(d.orders);

}catch(e){

box.innerHTML = `
<div class="helper">
Erro ao carregar pedidos.
</div>
`;

}

}

load();

</script>

</body>
</html>
