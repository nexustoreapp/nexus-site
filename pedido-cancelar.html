<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Nexus Store | Cancelar pedido</title>

  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="topbar-root"></div>

  <main class="page">
    <div class="container">
      <div class="card page-card">
        <div class="pad">
          <h2 style="font-weight:1000;">Cancelar pedido</h2>
          <p class="helper">O cancelamento é analisado manualmente pela equipe Nexus.</p>

          <div class="hr"></div>

          <div class="soft" style="padding:14px;">
            <div class="form-grid">
              <div>
                <div class="helper">ID do pedido</div>
                <div id="orderId" style="font-weight:1000;">—</div>
              </div>
              <div>
                <div class="helper">Status atual</div>
                <div id="orderStatus" style="font-weight:1000;">—</div>
              </div>
            </div>
          </div>

          <div class="soft" style="padding:14px;margin-top:12px;">
            <div class="helper" style="margin-bottom:8px;">Motivo do cancelamento</div>
            <textarea id="reason" class="input" placeholder="Explique o motivo do cancelamento ou reembolso" style="min-height:120px;padding-top:10px;"></textarea>

            <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;">
              <button id="cancelBtn" class="btn btn-primary" type="button">Solicitar cancelamento</button>
              <a class="btn btn-outline" href="pedidos.html">Voltar</a>
              <a class="btn btn-ghost" href="minha-conta.html">Minha conta</a>
            </div>

            <div id="msg" class="helper" style="margin-top:10px;"></div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="layout.js"></script>
  <script src="out.js"></script>

  <script>
    // ===============================
    // AUTH
    // ===============================
    const token = localStorage.getItem("nexus_token");
    if (!token) {
      window.location.replace("login.html");
    }

    // ===============================
    // HELPERS
    // ===============================
    function qs(name){
      return new URLSearchParams(window.location.search).get(name);
    }
    function setMsg(t){
      const el = document.getElementById("msg");
      if (el) el.textContent = t || "";
    }
    function safeJson(r){
      return r.json().catch(()=>null);
    }

    // ===============================
    // LOAD PEDIDO
    // ===============================
    const orderId = qs("id");
    if (!orderId) {
      alert("Pedido inválido (sem id na URL).");
      window.location.replace("pedidos.html");
    }

    document.getElementById("orderId").textContent = orderId;

    fetch(`${window.NEXUS_API}/orders/${encodeURIComponent(orderId)}`, {
      headers: { "Authorization": "Bearer " + token }
    })
    .then(async (r) => {
      const d = await safeJson(r);
      if (!r.ok || !d?.ok) throw new Error(d?.error || "LOAD_FAILED");
      document.getElementById("orderStatus").textContent = d.order?.status || "—";
    })
    .catch(() => {
      document.getElementById("orderStatus").textContent = "—";
      setMsg("Não consegui carregar os dados do pedido agora.");
    });

    // ===============================
    // CANCELAR
    // ===============================
    document.getElementById("cancelBtn").addEventListener("click", async () => {
      setMsg("");

      const reason = (document.getElementById("reason").value || "").trim();
      if (!reason) {
        setMsg("Informe o motivo do cancelamento.");
        return;
      }

      try{
        const r = await fetch(`${window.NEXUS_API}/orders/${encodeURIComponent(orderId)}/cancel`, {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ reason })
        });

        const d = await safeJson(r);

        if (!r.ok || !d?.ok) {
          setMsg(d?.error || "Erro ao solicitar cancelamento.");
          return;
        }

        setMsg("Solicitação enviada. Nossa equipe irá analisar.");
      }catch{
        setMsg("Erro ao solicitar cancelamento.");
      }
    });
  </script>
</body>
</html>
